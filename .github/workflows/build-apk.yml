name: 构建 Watch8 世界时间 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu already has an Android SDK and sdkmanager.
      # Avoid android-actions/setup-android@v3: it forces an older SDK tools download.
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Ensure Android 35 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            echo "Android SDK 35 not fully preinstalled, installing missing parts"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          else
            echo "Android SDK 35 and build-tools 35.0.0 are preinstalled"
          fi

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android source ZIP into project root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] && [ -f app/build.gradle ]; then
            echo "Android project files already at repository root."
          else
            SOURCE_ZIP="Watch8_AirportWorldClock_134Cities_WearOS_Source.zip"
            test -f "$SOURCE_ZIP" || { echo "::error::Source ZIP not found: $SOURCE_ZIP"; exit 1; }
            EXTRACT_DIR="$RUNNER_TEMP/watch8-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"
            PROJECT_DIR="$EXTRACT_DIR/AirportWorldClock"
            test -f "$PROJECT_DIR/settings.gradle" || { echo "::error::No settings.gradle inside ZIP"; exit 1; }
            test -f "$PROJECT_DIR/app/build.gradle" || { echo "::error::No app/build.gradle inside ZIP"; exit 1; }
            cp "$PROJECT_DIR/settings.gradle" "$PROJECT_DIR/build.gradle" "$PROJECT_DIR/gradle.properties" .
            cp -R "$PROJECT_DIR/app" ./app
            echo "Android project extracted to repository root."
          fi

      - name: Verify Android project structure
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build Wear OS APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Watch8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-AirportWorldClock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
